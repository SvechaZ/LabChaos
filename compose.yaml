# roombook ระบบจองห้องติว
#
#   cp .env.example .env             ครั้งแรกครั้งเดียว แล้วแก้รหัสผ่านใน .env
#   docker compose up -d --build     เปิดทุก service
#   docker compose ps                ดูสถานะ
#   docker compose logs -f backend   ดู log ของ backend
#   docker compose down              ปิดทั้งหมด ข้อมูลการจองยังอยู่ใน volume
#   docker compose down -v           ปิดและลบข้อมูลทั้งหมด
#
# ผู้ใช้เปิดเว็บที่ http://<IP ของ VM>/
# backend เปิดให้เฉพาะตัว VM ที่ 127.0.0.1:8080 สำหรับเครื่องมือแล็บ
# db ไม่เปิดพอร์ตออกนอก มีแค่ backend ที่คุยด้วยได้

services:
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 8080
      STORE: postgres
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-roombook}
      PGUSER: ${POSTGRES_USER:-roombook}
      PGPASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env ก่อน ดู .env.example}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # ใช้ /healthz ไม่ใช่ /readyz ฐานข้อมูลล่มแล้ว backend ยังถือว่าปกติ
      # จะได้เห็นผลกระทบของชั้นล่างใน SLI ตรง ๆ ไม่ใช่ backend โดนรีสตาร์ตวน
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roombook}
      POSTGRES_USER: ${POSTGRES_USER:-roombook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env ก่อน ดู .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
      # รันครั้งเดียวตอน volume ยังว่าง
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # ใช้ -h 127.0.0.1 ให้เช็กผ่าน TCP แบบเดียวกับที่ backend ต่อ
      # ตอนรัน init.sql รอบแรก PostgreSQL เปิดแค่ unix socket ถ้าเช็กผ่าน socket จะผ่านก่อนเวลา
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
