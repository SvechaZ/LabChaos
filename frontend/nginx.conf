# roombook frontend
# ส่งไฟล์หน้าเว็บเอง และส่งต่อทุกคำขอ /api/ ไปที่ backend

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ไม่บอกเวอร์ชันของ nginx ในหน้า error และ header
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # DNS ภายในของ Docker ให้หาชื่อ backend ใหม่ทุก 10 วินาที
    # ถ้า backend ยังไม่ขึ้นหรือล่มอยู่ nginx ยังเปิดได้ และตอบ 502 แทนการล่มตาม
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # หน้าเว็บตัดคำขอที่ 8 วินาที nginx รอนานกว่านั้นเล็กน้อย
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # health ของตัว nginx เอง ไม่ถาม backend
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"roombook-frontend"}';
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html, app.js และ styles.css ให้เบราว์เซอร์ถามทุกครั้งว่ามีของใหม่ไหม
    # แก้หน้าเว็บแล้ว deploy ผู้ใช้จะได้ของใหม่ทันที
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
